# command line arguments
command_line_args:
  - - --source  # name
    - ""  # default
    - ""  # action
    - path to video to process  # help
  - - --output-path  # name
    - "output"  # default
    - ""  # action
    - path to output file or folder  # help
  - - --device  # name
    - ""  # default
    - ""  # action
    - "cuda device, i.e. 0 or 0,1,2,3 or cpu"  # help
  - - --write-video  # name
    - False  # default
    - "store_true"  # action
    - flag to write video  # help
  - - --do-inference  # name
    - False  # default
    - "store_true"  # action
    - do inference with model instead of loading from database  # help
  - - --inferences-dir  # name
    - '/root/app/inferences_bucket'  # default
    - ""  # action
    - directory to save inferences downloaded from database  # help
  - - --weights-dir  # name
    - '../weights'  # default
    - ""  # action
    - base directory to search for models' weights  # help
  - - --local-config
    - 'local_config.yaml'
    - ""
    - path to local config file
  - - --global-config
    - 'cv_common/global_config.yaml'
    - ""
    - path to global config file
  - - --cone-camera
    - False
    - "store_true"
    - flag to show, whether the camera is cone or wing
  - - --json-fn
    - None
    - ""
    - output json filename
