# video params
width: 1920
height: 1080
img_size: 1280  # img_size for inference
fps: 8  # in/out frame rate
fourcc: DIVX  # output video codec
save_format: mkv

tracking:
  airplane:
    norfair:
#      distance_threshold: 120  # for euclidean distance
      distance_threshold: 0.8  # 0.2 minimal possible match
      initialization_delay: 8
      hit_inertia_max: 40
    tracked_object:
      stopping_time_thres: 24  # 3*8 // here 8 is fps
      static_points_thres: 0.5  # how much points show be static to consider object stopped
      proceeding_time_thres: 16 # 2*8 // here 8 is fps
      display_proceeding_time_thres: 5 # 5 // here 8 is fps
      moving_time_thres: 8  # 1*8 // here 8 is fps
      init_dots_lifetime: 16  # renew dots for optical flow each 16 frames
      min_points_number: 2 # update status only if at least 2 points are present
      movement_anomaly_thres_x: 50 
      movement_anomaly_thres_y: 5 
      # x - left-right
      from_x: 0.35
      to_x: 0.9
      # y – top-down
      from_y: 0.25
      to_y: 0.8
      real_height: 7

  gse:
    norfair:
#      distance_threshold: 120  # for euclidean distance
      distance_threshold: 0.8  # 0.2 minimal possible match
      initialization_delay: 8
      hit_inertia_max: 40
    tracked_object:
      stopping_time_thres: 24  # 3*8 // here 8 is fps
      static_points_thres: 0.5  # how much points show be static to consider object stopped
      proceeding_time_thes: 16 # 2*8 // here 8 is fps
      display_proceeding_time_thres: 5 # 5 // here 8 is fps
      moving_time_thres: 8  # 1*8 // here 8 is fps
      init_dots_lifetime: 5  # renew dots for optical flow each 5 frames
      min_points_number: 2 # update status only if at least 2 points are present
      # x - left-right
      from_x: 0.1
      to_x: 0.9
      # y – top-down
      from_y: 0.2
      to_y: 0.9
      real_height: 2

  beltloader:
    norfair:
#      distance_threshold: 120  # for euclidean distance
      distance_threshold: 0.8  # 0.2 minimal possible match
      initialization_delay: 8
      hit_inertia_max: 40
    tracked_object:
      stopping_time_thres: 24  # 3*8 // here 8 is fps
      static_points_thres: 0.5  # how much points show be static to consider object stopped
      proceeding_time_thes: 16 # 2*8 // here 8 is fps
      display_proceeding_time_thres: 5 # 5 // here 8 is fps
      moving_time_thres: 8  # 1*8 // here 8 is fps
      init_dots_lifetime: 10  # renew dots for optical flow each 5 frames
      min_points_number: 2 # update status only if at least 2 points are present
      # x - left-right
      from_x: 0.1
      to_x: 0.7
      # y – top-down
      from_y: 0.4
      to_y: 0.9
      real_height: 3

  person:
    norfair:
#      distance_threshold: 40  # for euclidean distance
      distance_threshold: 0.7
      initialization_delay: 5
      hit_inertia_max: 30

# models params
conf_thres: 0.35
chock_conf_thres: 0.1
vehicle_conf_thres: 0.4
iou_thres: 0.5
deepsort_weights: scripted_ckpt.t7
general_model_weights: GM_yolov8m_best_augmentation_march2024.onnx
vehicle_model_weights: VM_yolov8m_last_september2023.onnx
chocks_model_weights: chocks_v4.3_200ep_yolov8.onnx
camera_classifier_weights: camera_cls_effnet_b0_october_v1.8.1.pt
entity_detector_weights: entity_det_aug_expnd.pt
pose_config: mmpose/configs/top_down/darkpose/coco/hrnet_w48_coco_384x288_dark.py
pose_checkpoint: hrnet_w48_coco_384x288_dark-741844ba_20200812.pth
#weights_dir: ../weights

# some files' names
logs_name: log_{video_name}_{datetime}.log
csv_name: csv_{video_name}_{datetime}.csv

# Constants for simple depth estimating
worker_height: 1.75  # 1.75m
airplane_height: 7  # 7m
pixel_size: 0.0000125  # 0.0075 mm
focal_length: 0.035  # 35 mm
camera_angle: 60  # 60 degrees camera

