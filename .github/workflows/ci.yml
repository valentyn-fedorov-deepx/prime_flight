name: fast gates

# Everything here runs without a GPU, without weights and without a single production video: the contract, the receiver,
# GM and tracker mechanics, the real-time runtime on a synthetic clip, the component layer. About a minute end to end.
# The gates that need the RTX machine and the private module checkouts live in gpu-gates.yml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: install
        run: pip install -r requirements-ci.txt

      - name: ffmpeg (the branch pins its decoder on both sides of a comparison, X4)
        run: ffmpeg -version | head -1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: defects that would break at runtime
        run: ruff check --select E9,F63,F7,F82,F811 .

      - name: unit gates
        run: pytest -q -rs

      - name: the real-time branch end to end on a synthetic clip
        run: python scripts/ci_rt_smoke.py --seconds 24

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt-smoke-report
          path: out/ci/rt_smoke.json
          if-no-files-found: warn

  style:
    # The style debt is visible, not blocking: ~450 findings today (UP, SIM, I, BLE...). Turn this into a gate once the
    # backlog is cleared, module by module.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --statistics . || true
